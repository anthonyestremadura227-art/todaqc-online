<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TODA QC </title>
<link rel="manifest" href="../manifest.json">
<style>
body{font-family:Arial;background:linear-gradient(135deg,#1e3a8a,#3b82f6);display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
.card{background:white;padding:32px;border-radius:24px;width:360px;box-shadow:0 20px 60px rgba(0,0,0,0.3)}
input{width:100%;padding:14px;margin:8px 0;border:2px solid #e5e7eb;border-radius:12px;box-sizing:border-box;font-size:15px}
button{width:100%;padding:14px;background:#111827;color:white;border:none;border-radius:12px;cursor:pointer;margin-top:12px;font-weight:bold;font-size:15px}
button:hover{background:#000}
h1{text-align:center;margin:0 0 8px 0;font-size:28px}
.logo{text-align:center;font-size:40px}
.label{font-weight:bold;font-size:13px;color:#374151;margin-top:8px;display:block}
.hint{font-size:10px;color:#9ca3af;text-align:center;margin-top:12px}
.create-box{border:2px dashed #16a34a;padding:16px;border-radius:12px;margin-top:16px;text-align:center;background:#f0fdf4}
</style>
</head>
<body>
<div class="card">
<div class="logo">🛺</div>
<h1>TODA QC</h1>
<p style="text-align:center;font-size:11px;color:#6b7280;margin:0 0 20px 0">WEB APP - PWA - INSTALLABLE!<br>PHONE + COMPUTER + APP</p>

<label class="label">Username</label>
<input type="text" id="username" placeholder="Enter username" value="">

<label class="label">Password - Press ENTER</label>
<input type="password" id="password" placeholder="Enter password" value="" onkeypress="if(event.key==='Enter'){login()}">

<button onclick="login()">🔒 Log in - CLICK or ENTER</button>
<p id="error" style="color:red;text-align:center;display:none;font-size:13px;margin-top:10px"></p>

<p class="hint">📱 Web App Ready!<br>Secure Login - TODA QC Online</p>

<div class="create-box">
<p style="font-weight:bold;color:#166534;margin:0 0 10px 0;font-size:13px">WALA KA PANG ACCOUNT?</p>
<button style="background:#16a34a" onclick="alert('Contact Admin for account - todaqc.online')">✨ CREATE NEW ACCOUNT</button>
</div>

<p style="text-align:center;font-size:11px;color:#2563eb;margin-top:12px">📱 Sa phone - Pindutin ⋮ → Add to Home Screen → App na!</p>
</div>

<script>
async function login(){
  const username=document.getElementById('username').value.trim();
  const password=document.getElementById('password').value.trim();
  const err=document.getElementById('error');
  if(!username||!password){err.style.display='block';err.textContent='Please enter username and password';return;}
  err.style.display='none';
  try{
    const res=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
    const data=await res.json();
    if(data.success){
      localStorage.setItem('toda_user',JSON.stringify(data.user));
      alert('Login success - Welcome '+data.user.username+'!');
      document.body.innerHTML='<div style="display:flex;justify-content:center;align-items:center;min-height:100vh;background:#f3f4f6;font-family:Arial"><div style="background:white;padding:40px;border-radius:20px;text-align:center"><h1>✅ Welcome '+data.user.username+'!</h1><p>TODA QC Dashboard - Live!</p><p>Role: '+data.user.role+'</p><button onclick="location.reload()" style="padding:12px 24px;background:#111827;color:white;border:none;border-radius:10px;cursor:pointer;margin-top:20px">Logout</button></div></div>';
    }else{
      err.style.display='block';err.textContent=data.message;
    }
  }catch(e){
    err.style.display='block';err.textContent='Server error - try again - '+e.message;
  }
}
</script>
</body>
</html>
